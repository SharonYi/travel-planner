<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Compass · 说走就走,帮你排好</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f4ef; color: #2d3436; line-height: 1.7; padding: 12px; max-width: 900px; margin: 0 auto; -webkit-text-size-adjust: 100%; word-wrap: break-word; overflow-wrap: break-word; }
  header { text-align: center; padding: 24px 16px 20px; background: linear-gradient(135deg,#2c5f6f,#3a7a8c); color: #fff; border-radius: 12px; margin-bottom: 14px; }
  header h1 { font-size: 21px; font-weight: 600; margin-bottom: 5px; }
  header .sub { font-size: 13px; opacity: .9; }
  .mode-bar { text-align: center; margin-bottom: 12px; font-size: 12.5px; color: #6b7280; }
  .mode-bar b { color: #2c5f6f; }
  .mode-bar a { color: #2c5f6f; text-decoration: underline; cursor: pointer; }

  #chat { background: #fff; border-radius: 12px; padding: 16px 14px; min-height: 320px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 14px; }
  .msg { margin-bottom: 14px; }
  .msg .who { font-size: 11.5px; font-weight: 700; margin-bottom: 3px; }
  .msg.user .who { color: #c2410c; }
  .msg.ai .who { color: #2c5f6f; }
  .bubble { border-radius: 10px; padding: 10px 13px; font-size: 14px; }
  .msg.user .bubble { background: #fff7ed; border: 1px solid #f3d9bf; }
  .msg.ai .bubble { background: #f4f8f9; border: 1px solid #dce8eb; }
  .bubble p { margin-bottom: 8px; }
  .bubble table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 8px 0; }
  .bubble th { background: #2c5f6f; color: #fff; padding: 5px 8px; text-align: left; }
  .bubble td { padding: 5px 8px; border-bottom: 1px solid #e0d9cf; vertical-align: top; }
  .bubble tr:nth-child(even) td { background: #faf8f4; }
  .bubble .day-h { font-weight: 700; color: #2c5f6f; margin-top: 8px; }
  .seg { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; color: #fff; margin: 1px 3px 1px 0; }
  .choice-btn { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid #c9a87c; color: #2d3436; border-radius: 8px; padding: 10px 14px; margin: 6px 0; cursor: pointer; font-family: inherit; font-size: 14px; }
  .choice-btn:hover { background: #faf8f4; }
  .choice-btn b { color: #2c5f6f; }
  .typing { color: #8a9ba8; font-size: 12.5px; font-style: italic; }
  .hint-chips { margin: 8px 0 0; }
  .hint-chips button { background: #f0ebe1; border: none; border-radius: 14px; color: #6b4f3a; font-size: 12px; padding: 4px 12px; margin: 2px 4px 2px 0; cursor: pointer; font-family: inherit; }

  #inputBar { background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  #inputBar textarea { width: 100%; border: 1px solid #e0d9cf; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 56px; background: #faf8f4; }
  .input-row { margin-top: 8px; text-align: right; }
  .btn { background: #2c5f6f; color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-size: 14px; cursor: pointer; font-family: inherit; margin-left: 8px; }
  .btn.ghost { background: #fff; color: #2c5f6f; border: 1px solid #c9a87c; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* 设置弹层 */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
  .modal-bg.on { display: block; }
  .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; border-radius: 12px; padding: 22px 20px; width: min(520px, 92vw); max-height: 85vh; overflow-y: auto; z-index: 11; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .modal.on { display: block; }
  .modal h4 { color: #2c5f6f; font-size: 16px; margin-bottom: 8px; }
  .modal label { display: block; font-size: 12.5px; color: #8c6a4f; margin: 10px 0 3px; }
  .modal input, .modal select { width: 100%; padding: 8px 10px; border: 1px solid #e0d9cf; border-radius: 6px; font-size: 14px; font-family: inherit; }
  .modal .note { font-size: 12px; color: #6b7280; margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2d3436; color: #fff; padding: 9px 20px; border-radius: 20px; font-size: 13.5px; display: none; z-index: 12; }
  footer { text-align: center; color: #b8a89a; font-size: 12px; padding: 12px; }
</style>
</head>
<body>

<header>
  <h1>🧭 Trip Compass</h1>
  <div class="sub">告诉我目的地和时间,我来出方案、排行程、盯细节</div>
</header>

<div class="mode-bar">
  当前模式:<b id="modeLabel">离线规划(内置目的地)</b> · <a onclick="openSettings()">切换到 AI 模式 / 设置</a>
</div>

<div id="chat"></div>

<div id="inputBar">
  <textarea id="userInput" placeholder="例:十一想去日本关西看红叶,大概 5 天,2 个人,想逛设计小店…"></textarea>
  <div class="hint-chips">
    <button onclick="fillInput('十一想去日本关西看红叶,5天左右,2人,自然为主+设计小店')">🍁 关西红叶 5 天</button>
    <button onclick="fillInput('想去巴厘岛+双火山,10天左右,4个女生,想体验潜')">🌋 巴厘岛双火山</button>
    <button onclick="fillInput('北京周边草原自驾两日,单人开车,单次别开太久')">🌾 草原自驾</button>
  </div>
  <div class="input-row">
    <button class="btn ghost" onclick="exportHTML()">📤 导出行程单</button>
    <button class="btn" onclick="send()">发送 ➤</button>
  </div>
</div>

<!-- 设置弹层 -->
<div class="modal-bg" id="modalBg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <h4>⚙️ 模式与设置</h4>
  <label>规划模式</label>
  <select id="setMode">
    <option value="offline">离线模式——内置目的地知识库(关西/巴厘岛/北京周边),无需任何配置</option>
    <option value="ai">AI 模式——填入你自己的 Claude API Key,任意目的地实时规划</option>
  </select>
  <label>Claude API Key(仅 AI 模式需要)</label>
  <input id="setKey" type="password" placeholder="sk-ant-...">
  <label>模型</label>
  <select id="setModel">
    <option value="claude-sonnet-4-6">claude-sonnet-4-6(推荐,快且便宜)</option>
    <option value="claude-opus-4-8">claude-opus-4-8(最强)</option>
  </select>
  <div class="note">· Key 只存在<b>你自己的浏览器</b>里(localStorage),不上传任何服务器<br>· 在 console.anthropic.com 申请<br>· AI 模式直连 Anthropic API,页面保持纯静态</div>
  <div style="margin-top:14px;">
    <button class="btn" onclick="saveSettings()">保存</button>
    <button class="btn ghost" onclick="closeModal()">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer>Trip Compass · <a href="https://github.com/SharonYi/travel-planner" target="_blank" style="color:#8c6a4f;">GitHub 开源</a> · 数据仅存本地浏览器</footer>

<script>
// ══════════ 状态 ══════════
var LS_MODE = 'tripCompass.mode', LS_KEY = 'tripCompass.key', LS_MODEL = 'tripCompass.model';
var LS_TRIP = 'tripCompass.currentTrip';
function lsGet(k, d) { try { return localStorage.getItem(k) || d; } catch(e) { return d; } }
var mode = lsGet(LS_MODE, 'offline');
var apiKey = lsGet(LS_KEY, '');
var model = lsGet(LS_MODEL, 'claude-sonnet-4-6');
var state = null;          // {dest, days, people, prefs, phase: candidates|chosen|refined, plan[], chosenV, history[]}
var busy = false;

function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.style.display='block'; setTimeout(function(){ t.style.display='none'; }, 2400); }
function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fillInput(t) { document.getElementById('userInput').value = t; document.getElementById('userInput').focus(); }

function addMsg(who, html) {
  var chat = document.getElementById('chat');
  var d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = '<div class="who">' + (who==='user'?'👤 你':'🧭 Trip Compass') + '</div><div class="bubble">' + html + '</div>';
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}
function addTyping() {
  var chat = document.getElementById('chat');
  var d = document.createElement('div');
  d.className = 'msg ai';
  d.innerHTML = '<div class="who">🧭 Trip Compass</div><div class="bubble"><span class="typing">正在规划…(本地引擎)</span></div>';
  chat.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d;
}

// ══════════ 离线知识库 ══════════
// 每个目的地:关键词匹配、候选方案生成器(沿用真实案例的方法论)
var LIB = [
  {
    keys: ['关西','京都','大阪','日本','红叶','岚山','奈良'],
    match: function(t) { return this.keys.some(function(k){ return t.indexOf(k)>-1; }); },
    intro: '关西红叶窗口:峰期 11 月中下旬(人多+贵),**前中期(11 月上中旬)体验最佳**。',
    variants: [
      { name:'V1 · 京都深度', dist:'京都3晚+大阪2晚', hl:'岚山+东福寺+永观堂+鞍马贵船,红叶满配', hotel:'换1次', cost:'4500–6500', why:'红叶季的京都=目的地本身;你的自然+小店偏好它三者全占' },
      { name:'V2 · 京都+奈良', dist:'京都2.5+奈良0.5+大阪2', hl:'京都略减+小鹿+春日大社秋色', hotel:'换1次', cost:'4500–6500', why:'有「看鹿」执念时选;代价是挤掉一处京都红叶名所' },
      { name:'V3 · 京都+神户', dist:'京都2+神户1+大阪2', hl:'京都砍贵船线+六甲山红叶+有马温泉', hotel:'换2次', cost:'5000–7000', why:'想泡温泉选;代价是多搬一次酒店' }
    ],
    plan: [
      {t:'抵达→京都东山', acts:[['flight','落地 KIX'],['transit','HARUKA 75min'],['relax','只园白川夜散步']], hotel:'京都站南', trans:'HARUKA ~¥2900'},
      {t:'岚山一整天', acts:[['nature','竹林(8点前)+天龙寺+常寂光寺'],['activity','保津川小火车'],['relax','鸭川晚餐']], hotel:'京都站南', trans:'JR 嵯峨野线'},
      {t:'东福寺—伏见—永观堂', acts:[['nature','东福寺通天桥(开园即入)'],['nature','伏见稻荷千本鸟居'],['nature','永观堂+南禅寺夜枫']], hotel:'京都站南', trans:'JR+巴士'},
      {t:'鞍马→贵船→大阪', acts:[['nature','叡电红叶隧道+鞍马徒步2h'],['activity','川床錦秋床午餐'],['relax','梅田夜景+中崎町小店']], hotel:'梅田', trans:'叡电+JR'},
      {t:'大阪设计小店日', acts:[['activity','中崎町深度+堀江'],['relax','难波公园/大阪城红叶'],['flight','南海 Rapi:t 赴 KIX']], hotel:'', trans:'南海 Rapi:t ~¥1450'}
    ]
  },
  {
    keys: ['巴厘岛','bali','火山','布罗莫','bromo','sewu','印尼'],
    match: function(t) { return this.keys.some(function(k){ return t.indexOf(k)>-1; }); },
    intro: '巴厘岛+双火山:旱季(4–10月)最佳;瀑布+火山+海岛的经典三段式。',
    variants: [
      { name:'V1 · 双火山+佩妮达', dist:'Safari+Sewu+Bromo 3天+巴厘岛 6天', hl:'瀑布+火山日出+悬崖海景+体验潜', hotel:'多次', cost:'7000–10000', why:'打卡最全;体力要求高(两晚凌晨起)' },
      { name:'V2 · 纯巴厘岛', dist:'Sanur 3+图蓝本潜水+Amed+乌布', hl:'跳过爪哇火山,纯海岛度假', hotel:'3次', cost:'5000–7000', why:'不想起夜赶路选这个;节奏舒服' },
      { name:'V3 · 双火山+科莫多', dist:'火山2天+飞Labuan Bajo船宿2天', hl:'加科莫多龙+Manta 浮潜', hotel:'多次', cost:'9000–13000', why:'有潜水证选;无证不划算' }
    ],
    plan: [
      {t:'Safari+进山', acts:[['activity','Prigen Safari Park'],['transit','车程5h'],['relax','Semeru 山脚民宿']], hotel:'山脚', trans:'包车'},
      {t:'Tumpak Sewu→Bromo', acts:[['nature','Sewu 瀑布下峡谷2h'],['transit','经 Malang 上山3h']], hotel:'Bromo 火山村', trans:'包车'},
      {t:'Bromo 日出→飞巴厘岛', acts:[['nature','凌晨2点起·日出+火山口'],['flight','午后赴 SUB→DPS'],['relax','库塔入住']], hotel:'库塔', trans:'包车+航班'},
      {t:'佩妮达西线', acts:[['transit','快船40min'],['nature','Kelingking+Broken Beach 日落']], hotel:'岛上', trans:'快船+皮卡'},
      {t:'佩妮达东线+浮潜', acts:[['nature','Diamond Beach'],['activity','浮潜 Manta Point']], hotel:'Sanur', trans:'快船'},
      {t:'图蓝本体验潜', acts:[['activity','DSD 自由号沉船(岸潜)'],['relax','Amed 海边日落']], hotel:'Amed', trans:'包车'},
      {t:'水宫+梯田→乌布', acts:[['nature','Tirta Gangga+Tegalalang'],['relax','乌布市场+SPA']], hotel:'乌布', trans:'包车'},
      {t:'南部悬崖+海鲜', acts:[['nature','海神庙+Uluwatu'],['activity','黄昏 Kecak 舞'],['relax','Jimbaran 海鲜']], hotel:'Seminyak', trans:'包车'}
    ]
  },
  {
    keys: ['草原','坝上','张北','承德','北京周边','自驾','雾灵山','天路'],
    match: function(t) { return this.keys.some(function(k){ return t.indexOf(k)>-1; }); },
    intro: '北京周边草原:7–8月草最绿;看红叶则是 9 月下–10 月中(雾灵山/坝上)。',
    variants: [
      { name:'V1 · 张北草原天路', dist:'周五晚出发中途住+周六天路+周日回', hl:'全程高速,单次驾驶≤2h', hotel:'中途+张北', cost:'1000–1500', why:'单人驾驶友好;8月正季' },
      { name:'V2 · 承德+坝上环线', dist:'周五晚直达承德+周六坝上+周日回', hl:'避暑山庄+京北第一草原', hotel:'承德+坝上蒙古包', cost:'1200–1800', why:'天气不稳时的稳妥选择(承德方向晴天率高)' },
      { name:'V3 · 雾灵山红叶', dist:'周六主峰+民宿过夜+周日晨雾日出', hl:'华北秋色天花板(10月中)', hotel:'山下民宿/阿那亚', cost:'800–1500', why:'秋季专属;11月中旬后封山' }
    ],
    plan: [
      {t:'出发日', acts:[['transit','京藏/京承高速'],['relax','中途镇晚餐休整']], hotel:'中途镇', trans:'自驾 1.5–2h'},
      {t:'主景区日', acts:[['nature','核心景观(早到避人流)'],['activity','骑马/徒步/拍照'],['relax','日落']], hotel:'景区附近', trans:'自驾+索道'},
      {t:'返程日', acts:[['nature','晨雾/日出(可选早场)'],['transit','返程']], hotel:'', trans:'自驾 2–4h'}
    ]
  }
];

function matchLib(text) {
  for (var i=0;i<LIB.length;i++) if (LIB[i].match(text)) return LIB[i];
  return null;
}

// ══════════ 意图解析(轻量) ══════════
function parseReq(text) {
  var days = (text.match(/(\d+)\s*天/) || [0,0])[1];
  var people = (text.match(/(\d+)\s*(个人|人|个女生|个男生)/) || [0,0])[1];
  return { days: +days || 0, people: +people || 0, raw: text };
}

// ══════════ 对话流 ══════════
function send() {
  if (busy) { toast('它在想,稍等~'); return; }
  var text = document.getElementById('userInput').value.trim();
  if (!text) { toast('说点什么吧'); return; }
  document.getElementById('userInput').value = '';
  addMsg('user', esc(text));
  busy = true;
  if (mode === 'ai' && apiKey) { aiSend(text); }
  else { setTimeout(function(){ offlineReply(text); }, 500); }
}

function offlineReply(text) {
  var t = addTyping();
  setTimeout(function() {
    t.remove();
    if (!state) {
      // 第一轮:解析需求 → 匹配知识库 → 候选方案
      var lib = matchLib(text);
      var req = parseReq(text);
      if (!lib) {
        addMsg('ai', '<p>这个目的地我(离线模式)还没学过 🌱</p><p>两个选择:</p>' +
          '<button class="choice-btn" onclick="openSettings()"><b>① 切到 AI 模式</b>——填你自己的 Claude API Key,任意目的地都能规划</button>' +
          '<button class="choice-btn" onclick="fillInput(\'十一想去日本关西看红羊,5天左右,2人,自然为主+设计小店\')"><b>② 试试内置的</b>——关西红叶 / 巴厘岛双火山 / 北京草原自驾</button>');
        busy = false; return;
      }
      state = { lib: lib, days: req.days || 5, people: req.people || 2, raw: text, phase: 'candidates', plan: null };
      renderCandidates();
    } else if (state.phase === 'candidates') {
      // 候选阶段的反馈:重新对比/换条件
      var v = matchChoice(text);
      if (v) { chooseVariant(v); }
      else {
        state.raw += ' ' + text;
        addMsg('ai', '<p>收到你的补充 ✍️ 我重新对比一下——</p>');
        renderCandidates(true);
      }
    } else if (state.phase === 'chosen' || state.phase === 'refined') {
      refine(text);
    }
    busy = false;
  }, 700);
}

function matchChoice(text) {
  if (/V?[123]/.test(text)) {
    var m = text.match(/V?([123])/);
    if (m) { var idx = +m[1]-1; if (state.lib.variants[idx]) return state.lib.variants[idx]; }
  }
  if (text.indexOf('京都深度')>-1) return state.lib.variants[0];
  if (text.indexOf('奈良')>-1) return state.lib.variants[1];
  if (text.indexOf('神户')>-1) return state.lib.variants[2];
  return null;
}

function segHtml(s) {
  var colors = {nature:'#5b8c5a',activity:'#2c5f6f',relax:'#d4a76a',transit:'#8a9ba8',flight:'#b0578d'};
  return '<span class="seg" style="background:' + colors[s[0]] + ';">' + esc(s[1]) + '</span>';
}

function renderCandidates(isRerender) {
  var lib = state.lib;
  var rows = lib.variants.map(function(v, i){
    return '<tr><td><b>V'+(i+1)+'</b></td><td>'+esc(v.name.replace(/^V\d · /,''))+'</td><td>'+esc(v.dist)+'</td><td>'+esc(v.hl)+'</td><td>'+esc(v.hotel)+'</td><td>'+esc(v.cost)+'</td></tr>';
  }).join('');
  var btns = lib.variants.map(function(v, i){
    return '<button class="choice-btn" onclick="chooseVariant(LIB['+libIdx(lib)+'].variants['+i+'])"><b>'+esc(v.name)+'</b><br><span style="font-size:12px;color:#6b7280;">'+esc(v.why)+'</span></button>';
  }).join('');
  addMsg('ai', (isRerender?'':'<p>'+lib.intro.replace(/\*\*/g,'')+'</p><p>按你的需求('+state.days+'天·'+state.people+'人),给你三版方案:</p>') +
    '<table><tr><th></th><th>方案</th><th>分布</th><th>亮点</th><th>换酒店</th><th>人均¥</th></tr>'+rows+'</table>' +
    '<p style="font-size:12px;color:#6b7280;">在下方回复「V1/V2/V3」选择,或继续提要求(例:想加奈良 / 少换酒店)</p>' + btns);
}
function libIdx(lib) { for (var i=0;i<LIB.length;i++) if (LIB[i]===lib) return i; return 0; }

function chooseVariant(v) {
  state.phase = 'chosen';
  state.chosenV = v;
  var lib = state.lib;
  // 按 v 的分布截取/适配 plan
  state.plan = lib.plan.slice(0, Math.min(state.days, lib.plan.length));
  addMsg('ai', '<p>好选择 ✨ <b>'+esc(v.name)+'</b></p><p>下面是逐日细化,你可以直接反馈修改(例:D2 太赶 / 想加 XX / 换掉 XX):</p>' + planHtml());
}

function planHtml() {
  var colors = {nature:'#5b8c5a',activity:'#2c5f6f',relax:'#d4a76a',transit:'#8a9ba8',flight:'#b0578d'};
  return state.plan.map(function(d, i){
    var segs = d.acts.map(function(s){ return '<span class="seg" style="background:'+colors[s[0]]+';">'+esc(s[1])+'</span>'; }).join(' ');
    return '<div class="day-h">D'+(i+1)+' · '+esc(d.t)+'</div><div>'+segs+'</div>' +
      (d.hotel?'<div style="font-size:12px;color:#6b7280;">🏨 '+esc(d.hotel)+(d.trans?' · 🚃 '+esc(d.trans):'')+'</div>':'');
  }).join('') + '<div style="font-size:11.5px;color:#8a9ba8;margin-top:6px;"><span class="seg" style="background:#5b8c5a">自然</span><span class="seg" style="background:#2c5f6f">活动</span><span class="seg" style="background:#d4a76a">休闲</span><span class="seg" style="background:#8a9ba8">在途</span><span class="seg" style="background:#b0578d">飞行</span></div>';
}

function refine(text) {
  var t = addTyping();
  setTimeout(function() {
    t.remove();
    state.phase = 'refined';
    // 轻量规则:常见反馈就地改
    var changed = [];
    if (/太赶|太累|松一点|放松/.test(text)) {
      // 砍掉最后一个纯活动日的内容密度
      var last = state.plan[state.plan.length-1];
      if (last) { last.acts = last.acts.slice(0,2); changed.push('已给最后一天减负'); }
    }
    if (/加一天|多一天/.test(text) && state.plan.length < 10) {
      state.plan.push({t:'机动日', acts:[['relax','自由安排/补漏']], hotel:'', trans:''});
      changed.push('已加一天机动日');
    }
    if (/早一点|日出|早起/.test(text)) changed.push('提醒:D1 起记得调作息,早场点位提前 1h 到');
    if (/预算|多少钱/.test(text)) changed.push('预算参考:本方案 '+state.chosenV.cost+' RMB/人(不含国际机票)');
    var msg = changed.length ? '<p>收到 ✍️ '+changed.join(';')+'</p>' : '<p>收到你的反馈:「'+esc(text)+'」</p><p style="font-size:12.5px;color:#6b7280;">离线引擎的能力有限,这类调整我在 AI 模式下能做得更细。当前方案:</p>';
    addMsg('ai', msg + planHtml() + '<p style="font-size:12px;color:#6b7280;margin-top:8px;">继续反馈可再改;满意了点下方「导出行程单」👇</p>');
  }, 600);
}

// ══════════ AI 模式(直连 Anthropic,纯前端) ══════════
var SYS_PROMPT = '你是 Trip Compass,一个人机协作的旅行规划助手。方法论:\
1)先问清关键约束(具体日期/人数/证件等级/已订事项/预算),一次问完;\
2)给2-3版候选方案,用表格对比(分布/亮点/换酒店次数/人均成本/推荐理由),量化在途时间——在途时间是第一决策指标,单日超6h要预警;\
3)用户选定后逐日细化:每天给主题、活动段落(标注类型:自然/活动/休闲/在途/飞行)、交通方式+耗时、住宿;\
4)用户反馈后只调整受影响部分,逐轮收敛,不推翻全局;\
5)诚实反馈:方案物理不可行时直说;\
6)每次回复简洁,表格优先,最后给明确的下一步选项。\
回复用 HTML 片段(可用<p><table><b>标签),不要用 markdown。';

function aiSend(text) {
  var t = addTyping();
  t.querySelector('.typing').textContent = '正在规划…(AI 模式)';
  var history = JSON.parse(lsGet('tripCompass.chatHistory', '[]'));
  history.push({role:'user', content:text});
  var body = JSON.stringify({
    model: model,
    max_tokens: 3000,
    system: SYS_PROMPT,
    messages: history.slice(-12)
  });
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: body
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(data) {
    t.remove();
    var html = (data.content && data.content[0] && data.content[0].text) || '(空回复)';
    // 提取可能的行程结构(简单约定:AI 若输出 <plan> JSON 就解析)
    var m = html.match(/<plan>([\s\S]*?)<\/plan>/);
    if (m) {
      try { state = { phase:'refined', plan: JSON.parse(m[1]) }; } catch(e) {}
      html = html.replace(/<plan>[\s\S]*?<\/plan>/, '');
    }
    addMsg('ai', html);
    history.push({role:'assistant', content: html});
    localStorage.setItem('tripCompass.chatHistory', JSON.stringify(history.slice(-12)));
    busy = false;
  }).catch(function(e) {
    t.remove();
    addMsg('ai', '<p>AI 调用失败:'+esc(e.message)+'</p><p style="font-size:12.5px;color:#6b7280;">检查 API Key 是否有效/有余额;或切回离线模式先用着。设置里可以切换。</p>');
    history.pop();
    busy = false;
  });
}

// ══════════ 导出行程单 ══════════
function exportHTML() {
  if (!state || !state.plan || !state.plan.length) { toast('还没有行程,先聊出一个来 🧭'); return; }
  var colors = {nature:'#5b8c5a',activity:'#2c5f6f',relax:'#d4a76a',transit:'#8a9ba8',flight:'#b0578d'};
  var rows = state.plan.map(function(d, i){
    var segs = d.acts.map(function(s){ return '<span style="display:inline-block;padding:2px 7px;border-radius:4px;margin:1px 3px 1px 0;font-size:11px;color:#fff;background:'+colors[s[0]]+';">'+esc(s[1])+'</span>'; }).join('');
    return '<tr><td><b>D'+(i+1)+'</b></td><td>'+esc(d.t||'')+'</td><td>'+segs+'</td><td style="font-size:12px;">'+esc(d.trans||'')+'</td><td style="font-size:12px;">'+esc(d.hotel||'')+'</td></tr>';
  }).join('');
  var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>行程单</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f7f4ef;color:#2d3436;line-height:1.7;padding:12px;max-width:1000px;margin:0 auto}header{text-align:center;padding:22px 16px;background:#2c5f6f;color:#fff;border-radius:12px;margin-bottom:14px}h2{font-size:16px;color:#2c5f6f;margin:14px 0 8px}table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:10px}th{background:#2c5f6f;color:#fff;padding:7px 9px;text-align:left}td{padding:7px 9px;border-bottom:1px solid #e0d9cf;vertical-align:top}@media print{body{padding:0}}</style></head><body>' +
    '<header><h1 style="font-size:19px;">'+esc(state.lib ? state.lib.keys[0] : '行程')+(state.chosenV?' · '+esc(state.chosenV.name):'')+'</h1><div style="font-size:12.5px;opacity:.9;margin-top:4px;">'+state.days+' 天 · '+state.people+' 人</div></header>' +
    '<h2>📅 逐日行程</h2><table><tr><th>日</th><th>主题</th><th>安排</th><th>交通</th><th>住宿</th></tr>'+rows+'</table>' +
    '<p style="text-align:center;color:#b8a89a;font-size:11px;margin-top:14px;">由 Trip Compass 生成 · github.com/SharonYi/travel-planner</p></body></html>';
  var blob = new Blob([html], {type:'text/html'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '行程单.html';
  a.click(); URL.revokeObjectURL(a.href);
  toast('行程单已导出 📤');
}

// ══════════ 设置 ══════════
function openSettings() {
  document.getElementById('setMode').value = mode;
  document.getElementById('setKey').value = apiKey;
  document.getElementById('setModel').value = model;
  document.getElementById('modalBg').className='modal-bg on';
  document.getElementById('modal').className='modal on';
}
function closeModal() { document.getElementById('modalBg').className='modal-bg'; document.getElementById('modal').className='modal'; }
function saveSettings() {
  mode = document.getElementById('setMode').value;
  apiKey = document.getElementById('setKey').value.trim();
  model = document.getElementById('setModel').value;
  localStorage.setItem(LS_MODE, mode);
  localStorage.setItem(LS_KEY, apiKey);
  localStorage.setItem(LS_MODEL, model);
  document.getElementById('modeLabel').textContent = mode==='ai' ? 'AI 模式(你的 Claude Key)' : '离线规划(内置目的地)';
  closeModal(); toast('设置已保存 ⚙️');
}

document.getElementById('modeLabel').textContent = mode==='ai' && apiKey ? 'AI 模式(你的 Claude Key)' : '离线规划(内置目的地)';

document.getElementById('userInput').addEventListener('keydown', function(e) {
